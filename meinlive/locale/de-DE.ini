MeinLive.About.SourceCode="Quelltext (GPLv2)"
MeinLive.About.Text="<h2>MeinLive Studio</h2><p>Das Streaming-Programm für <a href='https://meinlive.de'>meinlive.de</a>.</p><h3>Basiert auf OBS Studio</h3><p>MeinLive Studio ist eine angepasste Version von <a href='https://obsproject.com'>OBS Studio</a>. Vielen Dank an das OBS-Projekt und alle Mitwirkenden! MeinLive Studio ist kein offizielles Produkt des OBS-Projekts.</p><p>Wie OBS Studio steht MeinLive Studio unter der GNU General Public License v2 (oder neuer). Den vollständigen Quelltext findest du auf <a href='https://github.com/MeinLive/meinlive-studio'>github.com/MeinLive/meinlive-studio</a>.</p>"

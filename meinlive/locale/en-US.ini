MeinLive.About.Text="<h2>MeinLive Studio</h2><p>The streaming app for <a href='https://meinlive.de'>meinlive.de</a>.</p><h3>Based on OBS Studio</h3><p>MeinLive Studio is a customized version of <a href='https://obsproject.com'>OBS Studio</a>. Many thanks to the OBS Project and all contributors! MeinLive Studio is not an official product of the OBS Project.</p><p>Like OBS Studio, MeinLive Studio is licensed under the GNU General Public License v2 (or later). The complete source code is available at <a href='https://github.com/MeinLive/meinlive-studio'>github.com/MeinLive/meinlive-studio</a>.</p>"
